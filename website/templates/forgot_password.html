{% extends "base.html" %}{% block content %}
<div class="row justify-content-center mt-5">
<div class="col-md-5">
<div class="card shadow rounded-4 border-0">
<div class="card-body p-4">
  <h5 class="text-center">🔑 Reset Password</h5>
  <p class="text-center small text-muted">Enter your email and new password</p>
  <form method="POST">
    <input type="email" class="form-control mb-3" name="email" placeholder="Your registered email" required>
    <input type="password" class="form-control mb-3" name="new_password" placeholder="New password" required>
    <input type="password" class="form-control mb-3" name="confirm_password" placeholder="Confirm new password" required>
    <button class="btn btn-warning w-100 fw-bold">Reset Password</button>
    <p class="text-center mt-3 small"><a href="/login">Back to Login</a></p>
  </form>
</div>
</div>
</div>
</div>
{% endblock %}
