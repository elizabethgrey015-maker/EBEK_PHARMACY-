{% extends "base.html" %}{% block content %}
<style>
.drug-lane-card{
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:8px;
  background:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.cart-box{
  margin-left:-20px; /* moves cart a bit left */
  position:sticky;
  top:90px;
}
.cart-item{
  border-bottom:1px solid #f1f5f9;
  padding:8px 0;
}
.qty-btn{
  width:26px; height:26px; padding:0;
  border:1px solid #cbd5e1; background:white; border-radius:6px;
}
</style>

<div class="row">
  <!-- LEFT - ONE LANE DRUGS -->
  <div class="col-md-7">
    <h5 class="fw-bold" style="color:#1d5bff;">Available Drugs - POS Terminal</h5>
    <input type="text" id="posSearch" class="form-control mb-3" placeholder="🔍 Search drug name...">

    <div id="posList">
      {% for drug in drugs %}
      <div class="drug-lane-card drug-item">
        <div>
          <div class="fw-bold" style="font-size:14px;">{{ drug.name }}</div>
          <small class="text-muted">{{ drug.category }} | Stock: {{ drug.stock }}</small>
        </div>
        <div class="text-end d-flex align-items-center gap-2">
          <span class="fw-bold me-2" style="color:#1d5bff;">GHS {{ "%.2f"|format(drug.price or 0) }}</span>
          <button class="btn btn-sm text-white" style="background:#1d5bff;" onclick="addToCart({{ drug.id }}, '{{ drug.name }}', {{ drug.price or 0 }}, {{ drug.stock or 0 }})" {% if (drug.stock or 0)==0 %}disabled{% endif %}>Add</button>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>

  <!-- RIGHT - CART MOVED LEFT -->
  <div class="col-md-5">
    <div class="card shadow-sm cart-box">
      <div class="card-header text-white fw-bold" style="background:#1d5bff;">Cart</div>
      <div class="card-body" id="cartBody"><p class="text-muted small">Cart empty</p></div>
      <div class="card-footer bg-white">
        <h6 class="fw-bold">Total: GHS <span id="total">0.00</span></h6>
        <form method="POST" action="/checkout" id="checkoutForm">
          <input type="hidden" name="cart_data" id="cartData">
          <button type="submit" class="btn w-100 text-white fw-bold mt-2" style="background:#1d5bff;">Pay & Print Receipt</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
let cart=[];
function addToCart(id,name,price,stock){
 let f=cart.find(c=>c.id===id);
 if(f){ if(f.qty<stock) f.qty++; else alert('Out of stock'); }
 else { if(stock>0) cart.push({id,name,price,qty:1,stock}); else alert('Out of stock'); }
 renderCart();
}
function renderCart(){
 if(cart.length==0){
  document.getElementById('cartBody').innerHTML='<p class="text-muted small">Cart empty</p>';
  document.getElementById('total').innerText='0.00';
  document.getElementById('cartData').value=''; return;
 }
 let html='', tot=0;
 cart.forEach((it,i)=>{
  tot+=it.price*it.qty;
  html+=`<div class="cart-item">
    <div class="d-flex justify-content-between align-items-center">
      <div style="font-size:13px;"><b>${it.name}</b><br><small class="text-muted">GHS ${it.price.toFixed(2)} x ${it.qty}</small></div>
      <div class="text-end">
        <div class="mb-1"><b style="font-size:13px;">GHS ${(it.price*it.qty).toFixed(2)}</b></div>
        <div class="d-flex align-items-center gap-1 justify-content-end">
          <button class="qty-btn" onclick="changeQty(${i},-1)">-</button>
          <span style="min-width:20px; text-align:center; font-size:13px;">${it.qty}</span>
          <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
          <button class="btn btn-sm btn-outline-primary py-0 px-1 ms-1" title="Edit qty" onclick="editQty(${i})">✏️</button>
          <button class="btn btn-sm btn-danger py-0 px-1" onclick="removeI(${i})">🗑</button>
        </div>
      </div>
    </div>
  </div>`;
 });
 document.getElementById('cartBody').innerHTML=html;
 document.getElementById('total').innerText=tot.toFixed(2);
 document.getElementById('cartData').value=JSON.stringify(cart);
}
function changeQty(i,delta){
 let newQty = cart[i].qty + delta;
 if(newQty<=0){ removeI(i); return; }
 if(newQty>cart[i].stock){ alert('Stock limit: '+cart[i].stock); return; }
 cart[i].qty=newQty; renderCart();
}
function editQty(i){
 let n = prompt("Enter new quantity for "+cart[i].name, cart[i].qty);
 if(n==null) return;
 n=parseInt(n);
 if(isNaN(n) || n<=0){ alert('Invalid'); return; }
 if(n>cart[i].stock){ alert('Only '+cart[i].stock+' in stock'); return; }
 cart[i].qty=n; renderCart();
}
function removeI(i){ cart.splice(i,1); renderCart(); }

document.getElementById('posSearch').addEventListener('keyup', function(){
 let f=this.value.toLowerCase();
 document.querySelectorAll('.drug-item').forEach(c=>{ c.style.display=c.textContent.toLowerCase().includes(f)?'':'none'; });
});
</script>
{% endblock %}
